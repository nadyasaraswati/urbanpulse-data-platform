# Airflow 3 (LocalExecutor) untuk UrbanPulse - khusus pengembangan lokal.
#
# Jalankan : docker compose -f docker-compose.airflow.yml up -d --build
# UI       : http://localhost:8080  (auth dinonaktifkan, JANGAN dipakai di server publik)
# Linux/WSL: set AIRFLOW_UID=$(id -u) di .env supaya folder data/ bisa ditulis container
# Berhenti : docker compose -f docker-compose.airflow.yml down

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: urbanpulse-airflow:3.1.5
  env_file: .env
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: urbanpulse-local-dev-secret-change-me
    PYTHONPATH: /opt/airflow/urbanpulse/src
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/urbanpulse/src
    - ./config:/opt/airflow/urbanpulse/config
    - ./data:/opt/airflow/urbanpulse/data
    - ./airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    container_name: urbanpulse_airflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: urbanpulse_airflow_init
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: urbanpulse_airflow_apiserver
    command: api-server
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: urbanpulse_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: urbanpulse_airflow_dag_processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_pgdata:
